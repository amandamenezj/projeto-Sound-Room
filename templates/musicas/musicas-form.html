{% extends 'layout/base_menu.html' %}

{% block titulo %} Cadastro de Músicas {% endblock %}

{% block conteudo %}
<h2 class="mb-1">Cadastro de Músicas</h2>
<p class="suave mb-4">Preencha os dados para adicionar uma nova música.</p>

<div class="cartao p-4">
  <form method="post" class="row g-3">
    <div class="col-md-6">
      <label class="form-label" for="titulo">Título</label>
      <input id="titulo" name="titulo" class="form-control" required>
    </div>
    <div class="col-md-6">
      <label class="form-label" for="artista">Artista</label>
      <select id="artista" name="artista" class="form-select" required>
        <option value="">Escolha um artista</option>
      </select>
    </div>
    <div class="col-md-6">
      <label class="form-label" for="album">Álbum</label>
      <input id="album" name="album" class="form-control" required>
    </div>
    <div class="col-md-6">
      <label class="form-label" for="genero">Gênero</label>
      <input id="genero" name="genero" class="form-control" required>
    </div>
    <div class="col-md-6">
      <label class="form-label" for="duracao">Duração</label>
      <input id="duracao" name="duracao" placeholder="3:45" pattern="[0-9]+:[0-5][0-9]" title="Use minutos e segundos, como 3:45" class="form-control" required>
    </div>
    <div class="col-md-6">
      <label class="form-label" for="ano">Ano</label>
      <input id="ano" type="number" name="ano" min="1900" class="form-control" required>
    </div>
    <div class="col-12 d-flex gap-2 mt-4">
      <button class="btn btn-lilas px-4">Salvar</button>
      <a class="btn btn-contorno" href="{{ url_for('listar_musicas') }}">Cancelar</a>
    </div>
  </form>
</div>
{% endblock %}
