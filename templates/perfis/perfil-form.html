{% extends 'layout/base_menu.html'}

{% block titulo %} Perfil {% endblock %}

{% block conteudo %}

<div class="card">
  <div class="card-header">
    Cadastro de Perfil
  </div>
  <div class="card-body p-3" style="width: 600px">
    <form action="{{url_for('inserir_perfil')}}" method="post">
        <label for="nome" class=form-label> Nome do Perfil</label>
        <input type="text" name="" id="nome" class="form-control mb-3">
        
        <label for="descricao" class="form-label">Descricao</label>
        <textarea name="descricao" id="descricao" class="form-control mb-3"></textarea>
    
    <div class="d-flex justify-content-between"></div>
    <a href="{{url_for('listar_perfis')}}" class="btn btn-light">Voltar</a>
    <button type="submit" class="btn btn-lilas">Salvar</button>
    </form>
    
    
  </div>
</div>

{% endblock %}
