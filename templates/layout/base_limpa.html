<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>
    {% block titulo %}
      ✦ SoundRoom
    {% endblock %}
  </title>
  <!-- Bootstrap 5.3 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600&family=Playfair+Display:wght@800&display=swap" rel="stylesheet">
  <style>
    body { font-family: "Plus Jakarta Sans", sans-serif; background: #f5f0e8 !important; color: #171717; }
    h1, .logo { font-family: "Playfair Display", serif; font-weight: 800; }
    .suave { color: #6b665e; }
    .logo { color: #171717; text-decoration: none; }
    .cartao { background: #fdfbf6; border: 1px solid #e2dccf; border-radius: 20px; box-shadow: 0 14px 24px -14px rgba(0, 0, 0, 0.2); }
    .btn-lilas { background: #7b5bc7; color: #fff; font-weight: 600; border: 0; }
    .btn-lilas:hover { background: #6a4bb5; color: #fff; }
    .aviso { background: #f1ebfb; border: 1px solid #d9cdf2; color: #5a3fa0; border-radius: 12px; padding: 0.6rem 1rem; }
  </style>
</head>
<body class="bg-light d-flex align-items-center justify-content-center min-vh-100">

  <div class="container d-flex align-items-center justify-content-center min-vh-100 py-4">
    {% block conteudo %}

    {% endblock %}
  </div>

  <!-- Bootstrap 5.3 Bundle JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  
</body>
</html>
