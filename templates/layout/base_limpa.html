<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>
        {% block titulo %}
        SoundRoom
        {% endblock %}
    </title>
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600&family=Playfair+Display:wght@800&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <style>
      body { font-family: "Plus Jakarta Sans", sans-serif; background: #f5f0e8; color: #171717; }
      h1, h2, .logo, .numero { font-family: "Playfair Display", serif; font-weight: 800; }
      .suave { color: #6b665e; }
      .topo { background: #fdfbf6; border-bottom: 1px solid #e2dccf; }
      .logo { font-size: 1.25rem; color: #171717; text-decoration: none; }
      .menu a { color: #6b665e; text-decoration: none; font-weight: 500; }
      .menu a.ativo { color: #171717; font-weight: 600; }
      .btn-sair { border: 1px solid #e2dccf; border-radius: 999px; padding: 0.35rem 1.1rem; color: #171717; text-decoration: none; }
      .cartao { background: #fdfbf6; border: 1px solid #e2dccf; border-radius: 20px; box-shadow: 0 14px 24px -14px rgba(0, 0, 0, 0.2); }
      .numero { font-size: 2.5rem; color: #9b7ede; }
      .btn-lilas { background: #7b5bc7; color: #fff; font-weight: 600; border: 0; }
      .btn-lilas:hover { background: #6a4bb5; color: #fff; }
      .btn-contorno { background: transparent; color: #7b5bc7; font-weight: 600; border: 1px solid #7b5bc7; }
      .btn-contorno:hover { background: #7b5bc7; color: #fff; }
      .btn-excluir { background: transparent; color: #6b665e; border: 1px solid #e2dccf; font-weight: 600; }
      .btn-excluir:hover { background: #efe8dc; color: #171717; }
      .tabela th { background: #efe8dc; }
      .aviso { background: #f1ebfb; border: 1px solid #d9cdf2; color: #5a3fa0; border-radius: 12px; padding: 0.6rem 1rem; }
    </style>
  </head>
  <body>
    {% block menu %}
    <header class="topo">
      <div class="container d-flex flex-wrap align-items-center gap-4 py-3">

        {% block conteudo %}
        
        {% endblock %}
        
        </header>
    {% endblock %}

    <main class="container py-5">{% block conteudo %}{% endblock %}</main>
  </body>
</html>
