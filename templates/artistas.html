{% extends 'base.html' %}
{% block conteudo %}
<h2 class="mb-4">Cadastro de Artistas</h2>

<form method="post" class="cartao p-4 mb-5 row g-3">
  <div class="col-md-6"><label class="form-label">Nome artístico</label><input name="nome" class="form-control" required></div>
  <div class="col-md-6"><label class="form-label">Gênero musical</label><input name="genero" class="form-control" required></div>
  <div class="col-md-6"><label class="form-label">País</label><input name="pais" class="form-control" required></div>
  <div class="col-md-6"><label class="form-label">Ano de início</label><input type="number" name="ano_inicio" class="form-control" required></div>
  <div class="col-12"><button class="btn btn-lilas px-4">Salvar</button></div>
</form>

<div class="cartao overflow-hidden">
  <table class="table tabela m-0">
    <thead><tr><th>Nome artístico</th><th>Gênero</th><th>País</th><th>Início</th></tr></thead>
    <tbody>
      {% for a in artistas %}
        <tr><td>{{ a.nome }}</td><td>{{ a.genero }}</td><td>{{ a.pais }}</td><td>{{ a.ano_inicio }}</td></tr>
      {% endfor %}
    </tbody>
  </table>
</div>
{% endblock %}
